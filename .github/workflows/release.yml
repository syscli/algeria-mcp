name: Release

# Publishes to npm when a version tag is pushed: git tag v0.1.0 && git push --tags
# The package is published with a provenance statement that links it to this
# workflow run and commit, then listed in the official MCP Registry.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  MCP_PUBLISHER: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json and server.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node -e '
            const s = require("./server.json"), p = require("./package.json");
            if (s.version !== p.version || s.packages[0].version !== p.version) throw new Error("server.json version differs from package.json");
            if (s.name !== p.mcpName) throw new Error("server.json name differs from mcpName");
          '
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install mcp-publisher
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/registry_${MCP_PUBLISHER#v}_checksums.txt"
          sha256sum --check --ignore-missing "registry_${MCP_PUBLISHER#v}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
